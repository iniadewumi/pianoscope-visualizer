const CASES = [
  ['plain',    'CRESCENDO|IS HOUSE', 'Plain (regression)'],
  ['editorial','CRESCENDO *is* HOUSE', 'Editorial (regression)'],
  ['poster',   'CRESCENDO|IS HOUSE', 'Poster (regression)'],
  ['hollow',   'CRESCENDO|IS HOUSE', '03 Hollow - outline over solid'],
  ['hollow',   'CRESCENDO', '03 Hollow - single line stays solid'],
  ['band',     'CRESCENDO IS HOUSE', '04 Band - film-title bar + mono meta'],
  ['bubble',   'CRESCENDO|IS HOUSE', '06 Bubble - fat face, dark keyline']
];
const dt = window.PianoscopeDisplayText;
const bg = new Image();
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function run(){
  const glCanvas = document.createElement('canvas');
  const gl = glCanvas.getContext('webgl2') || glCanvas.getContext('webgl');
  dt.init(gl);
  dt.setOverlayEnabled(true);
  dt.setMeta('PIANOSCOPE \u00b7 124 BPM \u00b7 LISTENING ROOM');
  await document.fonts.ready;
  await sleep(400);
  const src = dt.getOverlayCanvas();
  const tiles = document.getElementById('tiles');
  for (const [style, text, label] of CASES){
    dt.setStyle(style);
    dt.applyText(text, {transition:'cut'});
    await sleep(260);
    dt.syncOverlay();
    const wrap = document.createElement('div');
    const h = document.createElement('h2'); h.textContent = label;
    const c = document.createElement('canvas');
    c.className = 'tile'; c.width = src.width; c.height = src.height;
    const cx = c.getContext('2d');
    cx.drawImage(bg, 0, 0, c.width, c.height);
    cx.drawImage(src, 0, 0);
    wrap.appendChild(h); wrap.appendChild(c); tiles.appendChild(wrap);
  }
  document.title = 'harness done';
}
bg.onload = run;
bg.src = FRAME;
